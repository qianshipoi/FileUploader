name: Release

# 推送 v 开头的 tag（如 v1.0.0 / v1.0.0-beta.1）时自动打包并发布到 Release；
# 也可以在 Actions 页面手动输入一个已存在的 tag 重新发布。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v1.0.0）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PROJECT: src/FileUploader.App/FileUploader.App.csproj
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  release:
    name: 打包并发布 Release
    runs-on: windows-latest

    steps:
      - name: 解析版本号
        id: ver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.event.inputs.tag || github.ref_name }}".Trim()
          if ([string]::IsNullOrWhiteSpace($tag)) { throw 'tag 为空，无法确定版本号' }

          $version = $tag -replace '^[vV]', ''
          if ($version -notmatch '^\d+(\.\d+){0,3}([.-][0-9A-Za-z.-]+)?$') {
            throw "tag ‘$tag’ 不像版本号（期望形如 v1.2.3 或 v1.2.3-beta.1）"
          }

          $isPrerelease = $version.Contains('-')
          "tag=$tag"                        >> $env:GITHUB_OUTPUT
          "version=$version"                >> $env:GITHUB_OUTPUT
          "prerelease=$($isPrerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "tag=$tag version=$version prerelease=$isPrerelease"

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 显示 SDK 信息
        shell: pwsh
        run: dotnet --info

      - name: 打包单文件便携版
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ steps.ver.outputs.version }}"
          $out = Join-Path $env:GITHUB_WORKSPACE 'out'

          dotnet publish $env:PROJECT -c Release -o $out -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=$version
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish 失败（exit $LASTEXITCODE）" }

      - name: 整理发布产物
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ steps.ver.outputs.version }}"
          $out   = Join-Path $env:GITHUB_WORKSPACE 'out'
          $name  = "FileUploader-$version-win-x64"

          $exe = Join-Path $out 'FileUploader.exe'
          if (-not (Test-Path $exe)) { throw "没有生成 $exe" }

          $target = Join-Path $out "$name.exe"
          Move-Item $exe $target -Force
          Compress-Archive -Path $target -DestinationPath (Join-Path $out "$name.zip") -CompressionLevel Optimal -Force

          $hash = (Get-FileHash $target -Algorithm SHA256).Hash
          $size = [math]::Round((Get-Item $target).Length / 1MB, 1)
          Write-Host "$name.exe  $size MB  SHA256=$hash"

          "name=$name"    >> $env:GITHUB_OUTPUT
          "sha256=$hash"  >> $env:GITHUB_OUTPUT
          "size_mb=$size" >> $env:GITHUB_OUTPUT

      - name: 生成 Release 说明
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag     = "${{ steps.ver.outputs.tag }}"
          $version = "${{ steps.ver.outputs.version }}"
          $name    = "${{ steps.pack.outputs.name }}"

          # 上一个 tag（没有则取全部历史）
          $prev = $null
          git fetch --tags --force 2>$null | Out-Null
          $prev = (git describe --tags --abbrev=0 "$tag^" 2>$null)
          $range = if ([string]::IsNullOrWhiteSpace($prev)) { $tag } else { "$prev..$tag" }
          $log = (git log $range --no-merges --pretty=format:'- %s (%h)' 2>$null) -join "`n"
          if ([string]::IsNullOrWhiteSpace($log)) { $log = '- 首个版本' }

          $lines = @(
            '## OSS 拖拽上传'
            ''
            'WinUI 3 + Reactor 写的 Windows 小工具：把文件拖进窗口就上传到 OSS / S3 兼容存储，并直接拿到可访问的链接。'
            ''
            '### 下载'
            ''
            "| 文件 | 说明 |"
            "|---|---|"
            "| ``$name.exe`` | **单文件便携版**，自带 .NET 10 运行时与 Windows App SDK |"
            "| ``$name.zip`` | 同上，压缩包（浏览器下载更稳，解压即用） |"
            ''
            '要求：Windows 10 1809+ / Windows 11，x64。目标机器**不需要装 .NET、也不需要装 Windows App Runtime**。'
            ''
            '- 直接双击 exe 即可运行；想配置和历史跟着 exe 走，在 exe 同级放一个空的 `portable.txt`。'
            '- exe 没有代码签名，首次运行可能弹「Windows 已保护你的电脑」→ 更多信息 → 仍要运行。'
            '- 使用说明见仓库 [README](https://github.com/${{ github.repository }}#readme)。'
            ''
            '### 校验'
            ''
            '```'
            "SHA256 ($name.exe) = ${{ steps.pack.outputs.sha256 }}"
            '```'
            ''
            "### 本次变更（$range）"
            ''
            $log
          )
          $path = Join-Path $env:GITHUB_WORKSPACE 'release-notes.md'
          [System.IO.File]::WriteAllText($path, ($lines -join "`n"), (New-Object System.Text.UTF8Encoding($false)))
          Get-Content $path

      - name: 发布到 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $tag  = "${{ steps.ver.outputs.tag }}"
          $name = "${{ steps.pack.outputs.name }}"
          $out  = Join-Path $env:GITHUB_WORKSPACE 'out'
          $files = @((Join-Path $out "$name.exe"), (Join-Path $out "$name.zip"))
          $notes = Join-Path $env:GITHUB_WORKSPACE 'release-notes.md'

          $exists = $false
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { $exists = $true; Write-Host "Release $tag 已存在，改为覆盖上传" }

          if ($exists) {
            gh release upload $tag @files --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload 失败（exit $LASTEXITCODE）" }
            gh release edit $tag --title "OSS 拖拽上传 $tag" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "gh release edit 失败（exit $LASTEXITCODE）" }
          } else {
            $ghArgs = @('release', 'create', $tag) + $files + @('--title', "OSS 拖拽上传 $tag", '--notes-file', $notes, '--verify-tag')
            if ('${{ steps.ver.outputs.prerelease }}' -eq 'true') { $ghArgs += '--prerelease' } else { $ghArgs += '--latest' }
            & gh @ghArgs
            if ($LASTEXITCODE -ne 0) { throw "gh release create 失败（exit $LASTEXITCODE）" }
          }

          Write-Host "已发布：https://github.com/${{ github.repository }}/releases/tag/$tag"
